server {
    listen 80;
    root /usr/share/nginx/html;

    # Like the Vite dev proxy: /api/... goes to the backend container, path unchanged.
    location /api/ {
        # Resolve "backend" through Docker's DNS on each request, so this keeps
        # working after the backend container is recreated with a new address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # React Router handles every other path (/login, /dashboard/customer/cart, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
